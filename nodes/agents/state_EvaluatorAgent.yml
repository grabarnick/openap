         - Коротким и структурированным (используй списки, если это уместно).
         - Вежливым и дружелюбным по тону.
      4. Если в оригинальном ответе были ссылки на источники, обязательно сохрани их в конце своего упрощенного текста.
      5. Твой ответ должен полностью заменить предыдущий для пользователя.
